name: Reader Lite Android compile check
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-lite-android-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.47.9'
      NDK_VERSION: '28.2.13676358'
      FQAPP_USE_MAVEN_MIRRORS: 'false'
      CARGO_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
      - name: Install Android components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get --enforce-lockfile
      - run: ./scripts/build_rust_backend.sh --skip-codegen
      - name: Compile unsigned APK for validation only
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi
