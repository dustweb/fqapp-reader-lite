name: Check upstream updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reader-lite-upstream
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - name: Prepare upstream merge for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/ch6vip/fqapp.git master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Already up to date.'
            exit 0
          fi
          upstream_sha=$(git rev-parse --short=12 FETCH_HEAD)
          branch="sync/upstream-$upstream_sha"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Update branch already exists: $branch"
          else
            git switch -c "$branch"
            if ! git merge --no-edit --no-ff FETCH_HEAD; then
              git merge --abort
              echo '::error::Upstream changes conflict with the lite version; a manual merge is required.'
              exit 1
            fi
            git push origin "$branch"
          fi
          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/master...$branch?expand=1"
          echo "上游更新分支：[$branch]($compare_url)" >> "$GITHUB_STEP_SUMMARY"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo 'A pull request already exists.'
          elif ! gh pr create --base master --head "$branch" \
            --title "同步上游更新 ($upstream_sha)" \
            --body '此更新合并了上游 master。请检查精简界面、阅读和听书功能，再合并；如有冲突请手动处理。'; then
            echo '::warning::Automatic pull request creation is unavailable. Open the compare link in the workflow summary to create it manually.'
          fi
