name: Reader Lite Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-lite-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  NDK_VERSION: '28.2.13676358'
  FQAPP_USE_MAVEN_MIRRORS: 'false'
  CARGO_BUILD_JOBS: '2'
  CMAKE_BUILD_PARALLEL_LEVEL: '2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore and verify the persistent release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: ${{ vars.READER_LITE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD EXPECTED_SIGNER_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; refusing to build an unsigned or differently signed APK."
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader-lite.jks"
          chmod 600 "$RUNNER_TEMP/reader-lite.jks"
          actual=$(keytool -list -v -keystore "$RUNNER_TEMP/reader-lite.jks" \
            -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo '::error::Signing certificate fingerprint does not match the pinned value.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
      - name: Install Android components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze source
        run: flutter analyze --no-pub
      - name: Test reading and paragraph comments
        run: flutter test --no-pub test/reader_ideas_test.dart
      - name: Build Rust libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash ./scripts/build_rust_backend.sh --skip-codegen
      - name: Build signed APKs
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/reader-lite.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi --build-number "$((100000 + GITHUB_RUN_NUMBER))"
      - name: Verify APK signatures
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.READER_LITE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          for apk in build/app/outputs/flutter-apk/app-{arm64-v8a,armeabi-v7a}-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.signer.txt"
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$apk.signer.txt" | tr '[:upper:]' '[:lower:]')
            [ -n "$actual" ] && [ "$actual" = "$expected" ] || { echo '::error::APK signature verification failed.'; exit 1; }
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Upload signed APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-lite-apk-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/*.apk.signer.txt
            build/app/outputs/flutter-apk/*.apk.sha256
